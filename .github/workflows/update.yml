name: 上映スケジュール更新

on:
  schedule:
    - cron: "13 21 * * *"   # 毎日 6:13（日本時間）
    - cron: "13 9 * * *"    # 毎日 18:13（日本時間）
  workflow_dispatch:         # Actions 画面から手動実行もできる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存パッケージを入れる
        run: npm install cheerio@1

      - name: 4館の公式サイトから取得
        run: node scrape.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: data.json をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json genre-cache.json
          git diff --cached --quiet || git commit -m "上映スケジュール更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push

      - name: 公開用ファイルをまとめる
        run: mkdir -p _site && cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
